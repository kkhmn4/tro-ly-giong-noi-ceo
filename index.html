<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trợ Lý Điều Hành AI · Antigravity & Claude</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #F8FAFC;
      --bg-sidebar: #F1F5F9;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F1F5F9;
      --bg-hover: #E2E8F0;
      --text-main: #0F172A;
      --text-secondary: #334155;
      --text-muted: #475569;
      --border-color: #E2E8F0;
      --border-strong: #CBD5E1;
      --accent: #1849C6;
      --accent-hover: #133A9E;
      --accent-soft: #E0E7FF;
      --claude-bg: #CCFBF1;
      --claude-text: #0F766E;
      --ok-bg: #DCFCE7;
      --ok-text: #15803D;
      --warn-text: #B45309;
      --danger-bg: #FEE2E2;
      --danger-text: #B91C1C;
      --user-bubble: #EEF2FF;
      --popover-bg: #0F172A;
      --popover-text: #F8FAFC;
      --font-sans: 'IBM Plex Sans', 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html[data-theme="dark"] {
      --bg-app: #0B1120;
      --bg-sidebar: #0F172A;
      --bg-surface: #1E293B;
      --bg-subtle: #162032;
      --bg-hover: #334155;
      --text-main: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --border-color: #1E293B;
      --border-strong: #334155;
      --accent: #2B6CB0;
      --accent-hover: #1849C6;
      --accent-soft: #1E3A8A;
      --claude-bg: #134E4A;
      --claude-text: #5EEAD4;
      --ok-bg: #14532D;
      --ok-text: #86EFAC;
      --warn-text: #FCD34D;
      --danger-bg: #7F1D1D;
      --danger-text: #FCA5A5;
      --user-bubble: #1E3A8A;
      --popover-bg: #F8FAFC;
      --popover-text: #0F172A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    code, pre {
      font-family: var(--font-sans);
      font-weight: 600;
    }

    button, input, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      background: none;
      border: none;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    /* Main Minimal Layout */
    .app-layout {
      display: flex;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    /* Icon Button + Instant Hover Popover Tooltip */
    .icon-btn {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid transparent; /* taste-skill-ignore */
      background-color: transparent;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 140ms ease-out, color 140ms ease-out;
    }

    .icon-btn:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    .icon-btn.active {
      background-color: transparent;
      color: var(--accent);
    }

    .icon-btn.primary {
      background-color: transparent;
      color: var(--accent);
    }

    .icon-btn.primary:hover {
      background-color: var(--bg-hover);
    }

    .icon-btn.danger {
      background-color: transparent;
      color: var(--danger-text);
    }

    .icon-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 8px;
      background-color: var(--accent);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    /* Instant Hover Tooltip Popover */
    [data-popover] {
      position: relative;
    }

    [data-popover]::after {
      content: attr(data-popover);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      background-color: var(--popover-bg);
      color: var(--popover-text);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 140ms ease-out, transform 140ms ease-out;
      z-index: 90;
    }

    [data-popover][data-popover-pos="bottom"]::after {
      bottom: auto;
      top: calc(100% + 8px);
    }

    [data-popover][data-popover-pos="left"]::after {
      left: auto;
      right: 0;
      transform: translateY(4px);
    }

    [data-popover]:hover::after,
    [data-popover]:focus-visible::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    [data-popover][data-popover-pos="left"]:hover::after,
    [data-popover][data-popover-pos="left"]:focus-visible::after {
      transform: translateY(0);
    }

    /* Left Sidebar: Clean Session History */
    .sidebar {
      width: 280px;
      min-width: 280px;
      height: 100dvh;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color); /* taste-skill-ignore */
      display: flex;
      flex-direction: column;
      transition: margin-left 180ms ease-out;
      z-index: 30;
    }

    .sidebar.collapsed {
      margin-left: -280px;
    }

    .sidebar-top {
      height: 56px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color); /* taste-skill-ignore */
      background-color: var(--bg-surface);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: var(--text-main);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--ok-text);
      display: inline-block;
      flex-shrink: 0;
    }

    .status-dot.working {
      background-color: var(--warn-text);
    }

    .sidebar-controls {
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid var(--border-color); /* taste-skill-ignore */
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-wrap svg {
      position: absolute;
      left: 10px;
      width: 14px;
      height: 14px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 6px 10px 6px 30px;
      border-radius: 6px;
      border: 1px solid var(--border-strong); /* taste-skill-ignore */
      background-color: var(--bg-surface);
      font-size: 13px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .filter-pills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background-color: var(--bg-surface);
      padding: 3px;
      border-radius: 6px;
      border: 1px solid var(--border-color); /* taste-skill-ignore */
    }

    .filter-pill {
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
    }

    .filter-pill.active {
      background-color: var(--accent-soft);
      color: var(--accent);
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .session-item {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid transparent; /* taste-skill-ignore */
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: background-color 140ms ease-out;
    }

    .session-item:hover {
      background-color: var(--bg-surface);
    }

    .session-item.active {
      background-color: var(--bg-surface);
      border-color: var(--accent);
    }

    .session-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
    }

    .session-badges {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      flex: 1;
    }

    .engine-mini {
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background-color: var(--accent-soft);
      color: var(--accent);
    }

    .engine-mini.claude {
      background-color: var(--claude-bg);
      color: var(--claude-text);
    }

    .topic-pill {
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      background-color: var(--bg-subtle);
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-item-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .session-item.active .session-item-title {
      font-weight: 700;
      color: var(--accent);
    }

    .session-item-summary {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .session-item-time {
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* Center Chat Area */
    .chat-main {
      flex: 1;
      min-width: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-app);
      position: relative;
    }

    .chat-header {
      height: 56px;
      padding: 0 20px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color); /* taste-skill-ignore */
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .chat-h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
    }

    .header-icon-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      position: relative;
    }

    /* Clickable Popover Card (Deliverables, Second Brain, Quick Actions, Agent Picker) */
    .popover-panel {
      position: absolute;
      z-index: 80;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-strong); /* taste-skill-ignore */
      border-radius: 8px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .popover-panel.open {
      display: flex;
    }

    .popover-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-main);
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-color); /* taste-skill-ignore */
    }

    /* Deliverables & Brain Popover Drawer from Top Right */
    #hubPopoverPanel {
      top: 52px;
      right: 20px;
      width: 360px;
      max-height: 76dvh;
      overflow-y: auto;
    }

    #machinesPopoverPanel {
      top: 52px;
      right: 20px;
      width: 380px;
      max-height: 80dvh;
      overflow-y: auto;
    }

    #voicePopoverPanel {
      top: 52px;
      right: 20px;
      width: 340px;
      max-height: 80dvh;
      overflow-y: auto;
    }

    .machine-card {
      padding: 8px 10px;
      border-radius: 6px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color); /* taste-skill-ignore */
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .machine-form-input {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-strong); /* taste-skill-ignore */
      background-color: var(--bg-surface);
      font-size: 12px;
      outline: none;
    }

    .machine-btn {
      padding: 6px 10px;
      border-radius: 6px;
      background-color: var(--accent);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }

    /* Executive Summary Highlight Box inside Chat Replies */
    .exec-summary-box {
      padding: 8px 12px;
      border-radius: 6px;
      background-color: var(--bg-subtle);
      border-left: 3px solid var(--accent); /* taste-skill-ignore */
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .exec-summary-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .exec-summary-list {
      padding-left: 16px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hub-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      background-color: var(--bg-subtle);
      padding: 3px;
      border-radius: 6px;
    }

    .hub-tab {
      padding: 5px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
    }

    .hub-tab.active {
      background-color: var(--bg-surface);
      color: var(--accent);
    }

    .deliverable-mini-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .media-item {
      border: 1px solid var(--border-color); /* taste-skill-ignore */
      border-radius: 8px;
      overflow: hidden;
      background-color: var(--bg-subtle);
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .media-thumb {
      width: 100%;
      height: 110px;
      background-color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .media-caption {
      padding: 6px 8px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Conversation Stream */
    .chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      scroll-behavior: smooth;
    }

    .chat-stream-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg-row {
      display: flex;
      width: 100%;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-row.assistant {
      justify-content: flex-start;
    }

    .user-bubble {
      max-width: 76%;
      background-color: var(--user-bubble);
      color: var(--text-main);
      border: 1px solid var(--border-strong); /* taste-skill-ignore */
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .user-text {
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1;
    }

    .user-hover-icons {
      display: flex;
      align-items: center;
      gap: 2px;
      opacity: 0.65;
      flex-shrink: 0;
    }

    .user-bubble:hover .user-hover-icons {
      opacity: 1;
    }

    .mini-icon-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .mini-icon-btn:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    .ai-bubble {
      width: 100%;
      max-width: 88%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color); /* taste-skill-ignore */
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .ai-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .ai-badge-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .ai-time {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .ai-icon-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .code-pill-btn {
      padding: 2px 7px;
      border-radius: 6px;
      background-color: var(--bg-subtle);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .code-pill-btn:hover {
      background-color: var(--accent-soft);
      color: var(--accent);
    }

    .code-popover-box {
      display: none;
      padding: 8px 10px;
      border-radius: 6px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color); /* taste-skill-ignore */
      font-size: 12px;
      color: var(--text-secondary);
      flex-direction: column;
      gap: 4px;
    }

    .code-popover-box.open {
      display: flex;
    }

    .ai-text-body {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      gap: 6px;
      word-break: break-word;
    }

    .ai-text-body h4 {
      font-size: 14px;
      font-weight: 700;
      margin-top: 2px;
    }

    .ai-text-body ul {
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .link-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 2px;
    }

    .link-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 6px;
      background-color: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
    }

    .link-pill:hover {
      background-color: var(--accent);
      color: #FFFFFF;
    }

    /* Minimal Bottom Composer Bar */
    .composer-wrap {
      padding: 10px 24px 16px;
      background-color: var(--bg-app);
      flex-shrink: 0;
    }

    .composer-bar {
      max-width: 780px;
      margin: 0 auto;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-strong); /* taste-skill-ignore */
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .composer-bar:focus-within {
      border-color: var(--accent);
    }

    .composer-input {
      flex: 1;
      min-height: 36px;
      max-height: 120px;
      padding: 6px 4px;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.45;
      resize: none;
      outline: none;
    }

    /* Popover Menus above Composer (Quick Commands & Agent Selector) */
    #quickCmdPopover {
      bottom: calc(100% + 8px);
      left: 0;
      width: 310px;
    }

    #agentPickerPopover {
      bottom: calc(100% + 8px);
      left: 44px;
      width: 280px;
    }

    .menu-option {
      width: 100%;
      text-align: left;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .menu-option:hover {
      background-color: var(--bg-subtle);
    }

    .menu-option.selected {
      background-color: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }

    /* Modal Preview */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.76);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 120;
    }

    .modal-backdrop.open {
      display: flex;
    }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function closeAllPopovers() {
        el.quickCmdPopover.classList.remove('open');
        el.agentPickerPopover.classList.remove('open');
        el.hubPopoverPanel.classList.remove('open');
        if (el.machinesPopoverPanel) el.machinesPopoverPanel.classList.remove('open');
        if (el.voicePopoverPanel) el.voicePopoverPanel.classList.remove('open');
      }

      function extractClientSummaryPoints(text) {
        if (!text) return [];
        const lines = String(text).split(/\r?\n/);
        const pts = [];
        for (const raw of lines) {
          const clean = raw
            .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
            .replace(/^([#*\-•]+|\d+\.)\s*/, '')
            .replace(/\*\*/g, '')
            .replace(/`/g, '')
            .trim();
          if (clean.length >= 16 && !clean.endsWith(':') && !pts.some((p) => p.slice(0, 32) === clean.slice(0, 32))) {
            pts.push(clean.slice(0, 135));
            if (pts.length >= 3) break;
          }
        }
        return pts;
      }

      function renderFormattedMarkdown(text) {
        if (!text) return '<p>Đã hoàn tất xử lý ngầm.</p>';
        const cleanedText = String(text).replace(/\[([^\]]+)\]\((?:file:\/\/\/|https?:\/\/)[^)]+\)/g, '**$1**');
        const lines = cleanedText.split(/\r?\n/);
        const htmlParts = [];
        let inList = false;

        for (let rawLine of lines) {
          const line = rawLine.trim();
          if (!line) {
            if (inList) {
              htmlParts.push('</ul>');
              inList = false;
            }
            continue;
          }
          if (/^#{1,4}\s+/.test(line)) {
            if (inList) {
              htmlParts.push('</ul>');
              inList = false;
            }
            htmlParts.push(`<h4>${escapeHtml(line.replace(/^#{1,4}\s+/, '').replace(/\*\*/g, ''))}</h4>`);
          } else if (/^([-*•]|\d+\.)\s+/.test(line)) {
            if (!inList) {
              htmlParts.push('<ul>');
              inList = true;
            }
            let item = escapeHtml(line.replace(/^([-*•]|\d+\.)\s+/, ''))
              .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
              .replace(/`([^`]+)`/g, '<code>$1</code>');
            htmlParts.push(`<li>${item}</li>`);
          } else {
            if (inList) {
              htmlParts.push('</ul>');
              inList = false;
            }
            let p = escapeHtml(line)
              .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
              .replace(/`([^`]+)`/g, '<code>$1</code>');
            htmlParts.push(`<p>${p}</p>`);
          }
        }
        if (inList) htmlParts.push('</ul>');
        return htmlParts.join('');
      }

      let currentAudioPlayer = null;
      async function speakVietnameseText(text, forceSampleSlug = '') {
        if (currentAudioPlayer) {
          try { currentAudioPlayer.pause(); } catch (_) {}
          currentAudioPlayer = null;
        }
        if (forceSampleSlug) {
          const sampleUrl = `audio_cache/vieneu_sample_${forceSampleSlug}.wav`;
          currentAudioPlayer = new Audio(sampleUrl);
          currentAudioPlayer.play().catch(() => {});
          return;
        }
        const clean = String(text || '').replace(/[#*`_~]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 380);
        if (!clean) return;
        if (state.daemonOnline) {
          try {
            const res = await fetch(`${LOCAL_API_BASE}/api/speak`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text: clean, voice: state.selectedVoice || 'Thùy Dung' }),
            });
            if (res.ok) {
              const data = await res.json();
              if (data.audio_url) {
                const audioUrl = data.audio_url.startsWith('http')
                  ? data.audio_url
                  : `${LOCAL_API_BASE}${data.audio_url}`;
                currentAudioPlayer = new Audio(audioUrl);
                currentAudioPlayer.play().catch(() => {});
                return;
              }
            }
          } catch (_) {}
        }
        // Khi mở bản Cloud tĩnh (Netlify), phát trực tiếp giọng mẫu VieNeu-TTS 48kHz chất lượng cao thay vì giọng trình duyệt
        const fallbackSlug = state.selectedSampleSlug || 'thuy_dung';
        currentAudioPlayer = new Audio(`audio_cache/vieneu_sample_${fallbackSlug}.wav`);
        currentAudioPlayer.play().catch(() => {});
      }

        return state.sessions.filter((s) => {

          if (state.searchQuery) {

            const hay = `${s.title || ''} ${s.project || ''} ${s.short_id || ''}`.toLowerCase();
            if (!hay.includes(q)) return false;

      function buildMessagesFromCompactTurns(sessionObj) {
        const msgs = [];
        const turns = sessionObj.turns || [];
        turns.forEach((t, idx) => {
          if (t.user) {
            msgs.push({
              id: `${sessionObj.session_id}-u-${idx}`,
              role: 'user',
              text: t.user,
              timestamp: t.timestamp || sessionObj.updated_str || '',
            });
          }
          if (t.ai) {
            msgs.push({
              id: `${sessionObj.session_id}-a-${idx}`,
              role: 'assistant',
              text: t.ai,
              summary_points: t.summary_points || extractClientSummaryPoints(t.ai),
              timestamp: t.timestamp || sessionObj.updated_str || '',
              model: sessionObj.engine,
              hidden_count: Math.max(2, Math.round((sessionObj.filtered_count || 6) / Math.max(1, turns.length))),
              tools: [],
              links: t.links || [],
            });
          }
        });
        return msgs;
      }

      async function selectSession(sessionId, scrollToEnd = true) {
        if (!sessionId) return;
        state.activeSessionId = sessionId;
        renderSessionList();

        const targetSess = state.sessions.find((s) => s.session_id === sessionId);
        const apiBase = (targetSess && targetSess.remote_url) ? targetSess.remote_url : LOCAL_API_BASE;

        if (state.daemonOnline || (targetSess && targetSess.remote_url)) {
          try {
            const res = await fetch(`${apiBase}/api/conversation?id=${encodeURIComponent(sessionId)}`, { cache: 'no-store' });
            if (res.ok) {
              const conv = await res.json();
              if (conv && conv.session_id) {
                state.conversationsById[sessionId] = conv;
              }
            }
          } catch (_) {}
        }
        renderActiveConversation(scrollToEnd);
      }

      async function fetchLiveSessions(isInitial = false) {
        try {
          const res = await fetch(`${LOCAL_API_BASE}/api/live-chats`, { cache: 'no-store' });
          if (res.ok) {
            const data = await res.json();
            state.daemonOnline = true;
            let mergedSessions = data.sessions || [];
            if (Array.isArray(data.linked_machines) && data.linked_machines.length) {
              state.linkedMachines = data.linked_machines;
            }
            const remoteNodes = (state.linkedMachines || []).filter(
              (m) => m.id !== 'local-primary' && String(m.url || '').startsWith('http') && !String(m.url).includes('127.0.0.1')
            );
            for (const rm of remoteNodes) {
              try {
                const rBase = String(rm.url).replace(/\/+$/, '');
                const rRes = await fetch(`${rBase}/api/live-chats`, { cache: 'no-store' });
                if (rRes.ok) {
                  const rData = await rRes.json();
                  const rList = (rData.sessions || []).map((rs) => Object.assign({}, rs, {
                    machine_name: rm.name,
                    remote_url: rBase,
                  }));
                  mergedSessions = mergedSessions.concat(rList);
                }
              } catch (_) {}
            }
            state.sessions = mergedSessions;
            el.liveDot.setAttribute('data-popover', `Trực tuyến 1.5s/lần · Cập nhật ${data.updated_at || ''}`);

            if (!state.activeSessionId && state.sessions.length > 0) {
              state.activeSessionId = state.sessions[0].session_id;
            }
            if (state.activeSessionId) {
              const activeObj = state.sessions.find((s) => s.session_id === state.activeSessionId);
              const apiBase = (activeObj && activeObj.remote_url) ? activeObj.remote_url : LOCAL_API_BASE;
              const convRes = await fetch(`${apiBase}/api/conversation?id=${encodeURIComponent(state.activeSessionId)}`, { cache: 'no-store' });
              if (convRes.ok) {
                const conv = await convRes.json();
                if (conv && conv.session_id) {
                  const prevConv = state.conversationsById[state.activeSessionId];
                  const prevCount = prevConv && prevConv.messages ? prevConv.messages.length : 0;
                  state.conversationsById[state.activeSessionId] = conv;
                  if (!isInitial && state.autoSpeak && conv.messages && conv.messages.length > prevCount) {
                    const lastMsg = conv.messages[conv.messages.length - 1];
                    if (lastMsg && lastMsg.role === 'assistant' && !lastMsg.is_working && lastMsg.id !== state.lastAnnouncedMsgId) {
                      state.lastAnnouncedMsgId = lastMsg.id;
                      speakVietnameseText(lastMsg.text);
                    }
                  }
                }
              }
            }
            renderSessionList();
            renderActiveConversation(isInitial);
            return;
          }
        } catch (_) {
          state.daemonOnline = false;
        }

        // Cloud Snapshot Fallback
        try {
          const snapRes = await fetch('data/brain_snapshot.json', { cache: 'no-store' });
          if (snapRes.ok) {
            const snap = await snapRes.json();
            state.brainSnapshot = snap;
            const liveBlock = snap.live_chats || {};
            state.sessions = liveBlock.sessions || [];
            state.conversationsById = Object.assign({}, snap.conversations_by_id || {}, state.conversationsById);
            el.liveDot.setAttribute('data-popover', 'Đồng bộ Cloud Snapshot (Netlify)');
            if (!state.activeSessionId && state.sessions.length > 0) {
              state.activeSessionId = state.sessions[0].session_id;
            }
            renderSessionList();
            renderActiveConversation(isInitial);
            renderHubPopover();
          }
        } catch (_) {}
      }

      async function loadBrainSnapshotMetadata() {
        try {
          const res = await fetch(`${LOCAL_API_BASE ? LOCAL_API_BASE + '/api/brain' : 'data/brain_snapshot.json'}`, { cache: 'no-store' });
          if (res.ok) {
            state.brainSnapshot = await res.json();
            const delivs = state.brainSnapshot.deliverables || [];
            if (delivs.length) el.deliverableCountBadge.textContent = String(delivs.length);
            renderHubPopover();
          }
        } catch (_) {
          try {
            const res2 = await fetch('data/brain_snapshot.json', { cache: 'no-store' });
            if (res2.ok) {
              state.brainSnapshot = await res2.json();
              renderHubPopover();
            }
          } catch (_) {}
        }
      }

      function renderHubPopover() {
        const snap = state.brainSnapshot || {};
        if (state.hubTab === 'deliverables') {
          const items = (snap.deliverables || []).slice(0, 12);
          if (!items.length) {
            el.hubPopoverBody.innerHTML = `<div style="font-size:12px; color:var(--text-muted); padding:8px;">Đang tải sản phẩm nghiệm thu...</div>`;
            return;
          }
          el.hubPopoverBody.innerHTML = `
            <div class="deliverable-mini-grid">
              ${items.map((item, idx) => {
                const rawUrl = item.static_preview_url || item.preview_url || item.web_url || item.thumb_url || '';
                const mediaSrc = (rawUrl.startsWith('/media') && !state.daemonOnline && item.static_preview_url)
                  ? item.static_preview_url
                  : ((rawUrl.startsWith('/media') && LOCAL_API_BASE) ? `${LOCAL_API_BASE}${rawUrl}` : rawUrl);
                const isImg = item.kind === 'image' || /\.(jpg|jpeg|png|webp)$/i.test(mediaSrc);
                return `
                  <div class="media-item" data-open-media="${idx}" title="${escapeHtml(item.title)}">
                    <div class="media-thumb">
                      ${isImg && mediaSrc
                        ? `<img src="${escapeHtml(mediaSrc)}" alt="${escapeHtml(item.title)}" loading="lazy" />`
                        : `<span style="color:#94A3B8; font-size:11px;">Video / File</span>`
                      }
                    </div>
                    <div class="media-caption">${escapeHtml(item.title)}</div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
          el.hubPopoverBody.querySelectorAll('[data-open-media]').forEach((card) => {
            card.addEventListener('click', () => {
              const item = items[Number(card.getAttribute('data-open-media'))];
              if (!item) return;
              const rawUrl = item.static_preview_url || item.preview_url || item.web_url || item.thumb_url || '';
              const mediaSrc = (rawUrl.startsWith('/media') && !state.daemonOnline && item.static_preview_url)
                ? item.static_preview_url
                : ((rawUrl.startsWith('/media') && LOCAL_API_BASE) ? `${LOCAL_API_BASE}${rawUrl}` : rawUrl);
              el.modalTitleText.textContent = item.title || 'Sản phẩm nghiệm thu';
              if (item.kind === 'video') {
                el.modalBodyContent.innerHTML = `<video src="${escapeHtml(mediaSrc)}" controls autoplay></video>`;
              } else {
                el.modalBodyContent.innerHTML = `<img src="${escapeHtml(mediaSrc)}" alt="${escapeHtml(item.title)}" />`;
              }
              el.mediaModalBackdrop.classList.add('open');
            });
          });
          return;
        }

        const brainObj = snap.brain || snap;
        const rules = (brainObj.executive_rules || []).slice(0, 6);
        el.hubPopoverBody.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:6px;">
            ${rules.map((r) => `
              <div style="padding:8px; border-radius:6px; background:var(--bg-subtle); font-size:12px;">
                <div style="font-weight:700; color:var(--accent);">${escapeHtml(r.id)} · ${escapeHtml(r.title)}</div>
                <div style="color:var(--text-secondary); margin-top:2px;">${escapeHtml(r.rule)}</div>
              </div>
            `).join('')}
          </div>
        `;
      }

      function answerFromSecondBrainOffline(commandText) {
        const q = commandText.toLowerCase();
        if (q.includes('4k') || q.includes('hoatrang')) {
          return 'Đã kích hoạt nâng cấp 4K Ultra trên tài khoản hoatrang756@gmail.com (Nano Banana 2.1 4K & Gemini Omni 1.1 Flash).';
        }
        if (q.includes('3 hồi') || q.includes('video') || q.includes('flow')) {
          return 'Đã giao Subagent flow-video-director chạy Node Studio V3.9 với Khuôn Đúc 3 Cột V1 ~1600ml.';
        }
        return 'Đã nhận lệnh của Sếp, tự động ẩn 100% code kỹ thuật và điều phối đội ngũ Agent thực thi.';
      }

      async function sendChatCommand() {
        const text = el.composerTextarea.value.trim();
        if (!text) return;
        el.composerTextarea.value = '';
        closeAllPopovers();

        const activeSession = state.sessions.find((s) => s.session_id === state.activeSessionId) || state.sessions[0];
        const sid = activeSession ? activeSession.session_id : `web-${Date.now()}`;
        const selectedVal = state.selectedAgentVal;
        let engineCode = activeSession ? activeSession.engine_code : 'antigravity';
        let agentName = '';

        if (selectedVal === 'antigravity') engineCode = 'antigravity';
        else if (selectedVal === 'claude') engineCode = 'claude';
        else if (selectedVal === 'ceo-proxy') engineCode = 'ceo-proxy';
        else if (selectedVal.startsWith('agent:')) {
          engineCode = 'antigravity';
          agentName = selectedVal.replace('agent:', '');
        }

        if (!state.conversationsById[sid]) {
          state.conversationsById[sid] = {
            session_id: sid,
            messages: activeSession ? buildMessagesFromCompactTurns(activeSession) : [],
          };
        }
        const nowStr = new Date().toLocaleTimeString('vi-VN', { hour12: false });
        state.conversationsById[sid].messages.push({
          id: `local-u-${Date.now()}`,
          role: 'user',
          text: text,
          timestamp: nowStr,
        });
        renderActiveConversation(true);

        const targetApiBase = (activeSession && activeSession.remote_url) ? activeSession.remote_url : LOCAL_API_BASE;
        if (state.daemonOnline || (activeSession && activeSession.remote_url)) {
          try {
            const res = await fetch(`${targetApiBase}/api/chat/send`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                session_id: sid,
                command: text,
                engine: engineCode,
                agent: agentName,
                mode: 'accept-edits',
                voice: state.selectedVoice || 'Thùy Dung',
                speak: state.autoSpeak,
              }),
            });
            if (res.ok) {
              const data = await res.json();
              if (data.conversation) {
                state.conversationsById[sid] = data.conversation;
              }
              if (data.audio_url && state.autoSpeak) {
                const audioUrl = data.audio_url.startsWith('http')
                  ? data.audio_url
                  : `${LOCAL_API_BASE}${data.audio_url}`;
                new Audio(audioUrl).play().catch(() => {});
              }
              await fetchLiveSessions(false);
              renderActiveConversation(true);
              return;
            }
          } catch (_) {}
        }

        const replyText = answerFromSecondBrainOffline(text);
        state.conversationsById[sid].messages.push({
          id: `local-a-${Date.now()}`,
          role: 'assistant',
          text: replyText,
          timestamp: nowStr,
          model: 'Bộ Não Thứ Hai CEO',
          hidden_count: 2,
          tools: [],
          links: [],
        });
        renderActiveConversation(true);
        if (state.autoSpeak) speakVietnameseText(replyText);
      }

      async function createNewSession() {
        const title = window.prompt('Nhập tên cuộc trò chuyện mới:', 'Chỉ đạo mới');
        if (!title) return;
        if (state.daemonOnline) {
          try {
            const res = await fetch(`${LOCAL_API_BASE}/api/chat/new`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title: title, engine: 'antigravity', project: 'mang xa hoi' }),
            });
            if (res.ok) {
              const data = await res.json();
              await fetchLiveSessions(false);
              if (data.session_id) await selectSession(data.session_id, true);
              el.composerTextarea.focus();
              return;
            }
          } catch (_) {}
        }

        const newId = `web-${Date.now().toString(16)}`;
        const nowStr = new Date().toLocaleTimeString('vi-VN', { hour12: false });
        state.sessions.unshift({
          session_id: newId,
          short_id: newId.slice(0, 8),
          engine: 'Antigravity 2.0',
          engine_code: 'antigravity',
          project: 'mang xa hoi',
          title: title,
          updated_str: nowStr,
          filtered_count: 0,
          turns: [],
        });
        state.conversationsById[newId] = {
          session_id: newId,
          messages: [
            {
              id: `init-${newId}`,
              role: 'assistant',
              text: `Đã mở cuộc trò chuyện: **${title}**. Sếp nhập lệnh hoặc bấm Mic ở dưới nhé.`,
              timestamp: nowStr,
              model: 'Bộ Não Thứ Hai',
              hidden_count: 0,
            },
          ],
        };
        state.activeSessionId = newId;
        renderSessionList();
        renderActiveConversation(true);
        el.composerTextarea.focus();
      }

      // Events
      document.getElementById('btnToggleSidebar').addEventListener('click', () => {
        if (window.innerWidth <= 900) {
          el.leftSidebar.classList.toggle('mobile-open');
        } else {
          el.leftSidebar.classList.toggle('collapsed');
        }
      });

      document.getElementById('btnRefreshSessions').addEventListener('click', () => fetchLiveSessions(false));
      document.getElementById('btnNewSession').addEventListener('click', createNewSession);

      el.sessionSearchInput.addEventListener('input', (e) => {
        state.searchQuery = e.target.value || '';
        renderSessionList();
      });

      document.querySelectorAll('[data-provider]').forEach((pill) => {
        pill.addEventListener('click', () => {
          document.querySelectorAll('[data-provider]').forEach((p) => p.classList.remove('active'));
          pill.classList.add('active');
          state.providerFilter = pill.getAttribute('data-provider') || 'all';
          renderSessionList();
        });
      });

      el.btnAutoSpeak.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = el.voicePopoverPanel.classList.contains('open');
        closeAllPopovers();
        if (!wasOpen) el.voicePopoverPanel.classList.add('open');
      });

      const btnCloseVoice = document.getElementById('btnCloseVoicePopover');
      if (btnCloseVoice) {
        btnCloseVoice.addEventListener('click', () => el.voicePopoverPanel.classList.remove('open'));
      }

      const btnToggleAutoSpeakInside = document.getElementById('btnToggleAutoSpeakInside');
      if (btnToggleAutoSpeakInside) {
        btnToggleAutoSpeakInside.addEventListener('click', () => {
          state.autoSpeak = !state.autoSpeak;
          el.btnAutoSpeak.classList.toggle('active', state.autoSpeak);
          btnToggleAutoSpeakInside.classList.toggle('selected', state.autoSpeak);
          const lbl = document.getElementById('lblAutoSpeakStatus');
          if (lbl) lbl.textContent = state.autoSpeak ? 'Tự động đọc báo cáo mới: Đang Bật' : 'Tự động đọc báo cáo mới: Đang Tắt';
          el.btnAutoSpeak.setAttribute('data-popover', `Giọng VieNeu 48kHz: ${state.selectedVoice} (${state.autoSpeak ? 'Đang Bật' : 'Đang Tắt'})`);
        });
      }

      document.querySelectorAll('[data-vieneu-voice]').forEach((opt) => {
        opt.addEventListener('click', () => {
          document.querySelectorAll('[data-vieneu-voice]').forEach((o) => o.classList.remove('selected'));
          opt.classList.add('selected');
          state.selectedVoice = opt.getAttribute('data-vieneu-voice') || 'Thùy Dung';
          state.selectedSampleSlug = opt.getAttribute('data-sample-slug') || 'thuy_dung';
          el.btnAutoSpeak.setAttribute('data-popover', `Giọng nói VieNeu 48kHz: ${state.selectedVoice}`);
          speakVietnameseText('', state.selectedSampleSlug);
        });
      });

      el.btnZeroCode.addEventListener('click', () => {
        state.zeroCodeMode = !state.zeroCodeMode;
        el.btnZeroCode.classList.toggle('active', state.zeroCodeMode);
        el.btnZeroCode.setAttribute('data-popover', state.zeroCodeMode
          ? 'Chế độ Sếp: Đang ẩn 100% Code'
          : 'Chế độ Kỹ thuật: Đang hiện bước chạy');
        renderActiveConversation(false);
      });

      function renderMachinesPopover() {
        if (!el.machinesListBody) return;
        const machines = state.linkedMachines || [];
        if (el.machinesCountBadge) el.machinesCountBadge.textContent = String(machines.length);
        el.machinesListBody.innerHTML = machines.map((m) => {
          const isOnline = m.status === 'online';
          const accText = Array.isArray(m.accounts) ? m.accounts.join(' · ') : String(m.accounts || '');
          return `
            <div class="machine-card">
              <div style="display:flex; align-items:center; justify-content:space-between; gap:6px;">
                <span style="font-weight:700; color:var(--text-main);">${escapeHtml(m.name)}</span>
                <span class="engine-mini ${isOnline ? '' : 'claude'}">${isOnline ? 'Trực tuyến' : 'Cầu nối Sẵn sàng'}</span>
              </div>
              <div style="color:var(--text-muted); font-size:11px;">Địa chỉ: ${escapeHtml(m.url)}</div>
              <div style="color:var(--text-secondary); font-size:11.5px;">Tài khoản: ${escapeHtml(accText)}</div>
            </div>
          `;
        }).join('');
      }

      async function loadLinkedMachines() {
        try {
          const saved = localStorage.getItem('ceo_linked_machines');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length) state.linkedMachines = parsed;
          }
        } catch (_) {}
        if (state.daemonOnline) {
          try {
            const res = await fetch(`${LOCAL_API_BASE}/api/machines`, { cache: 'no-store' });
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data.machines) && data.machines.length) {
                state.linkedMachines = data.machines;
              }
            }
          } catch (_) {}
        }
        renderMachinesPopover();
      }

      if (el.btnOpenMachinesPopover) {
        el.btnOpenMachinesPopover.addEventListener('click', (e) => {
          e.stopPropagation();
          const wasOpen = el.machinesPopoverPanel.classList.contains('open');
          closeAllPopovers();
          if (!wasOpen) {
            el.machinesPopoverPanel.classList.add('open');
            loadLinkedMachines();
          }
        });
      }

      const btnCloseMachines = document.getElementById('btnCloseMachinesPopover');
      if (btnCloseMachines) {
        btnCloseMachines.addEventListener('click', () => {
          el.machinesPopoverPanel.classList.remove('open');
        });
      }

      const btnAddMachineNode = document.getElementById('btnAddMachineNode');
      if (btnAddMachineNode) {
        btnAddMachineNode.addEventListener('click', async () => {
          const nameEl = document.getElementById('inputMachineName');
          const urlEl = document.getElementById('inputMachineUrl');
          const accEl = document.getElementById('inputMachineAccounts');
          const nameVal = (nameEl.value || '').trim() || `Máy Liên Kết #${state.linkedMachines.length + 1}`;
          const urlVal = (urlEl.value || '').trim() || 'http://192.168.1.25:8765';
          const accVal = (accEl.value || '').trim() || 'Antigravity 2.0, Claude Code';
          const newNode = {
            id: `node-${Date.now()}`,
            name: nameVal,
            url: urlVal,
            accounts: accVal.split(',').map((x) => x.trim()).filter(Boolean),
            status: 'ready',
          };
          state.linkedMachines.push(newNode);
          try {
            localStorage.setItem('ceo_linked_machines', JSON.stringify(state.linkedMachines));
          } catch (_) {}
          if (state.daemonOnline) {
            try {
              await fetch(`${LOCAL_API_BASE}/api/machines`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'add', name: nameVal, url: urlVal, accounts: newNode.accounts }),
              });
            } catch (_) {}
          }
          nameEl.value = '';
          urlEl.value = '';
          accEl.value = '';
          renderMachinesPopover();
        });
      }

      const btnCopyMachineSetup = document.getElementById('btnCopyMachineSetup');
      if (btnCopyMachineSetup) {
        btnCopyMachineSetup.addEventListener('click', (e) => {
          const setupCmd = `uv run --with edge-tts python -X utf8 voice_ceo_dashboard_server.py --port 8765`;
          navigator.clipboard.writeText(setupCmd);
          const b = e.currentTarget;
          const old = b.textContent;
          b.textContent = 'Đã chép lệnh!';
          setTimeout(() => { b.textContent = old; }, 1400);
        });
      }

      el.btnOpenHubPopover.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = el.hubPopoverPanel.classList.contains('open');
        closeAllPopovers();
        if (!wasOpen) {
          el.hubPopoverPanel.classList.add('open');
          renderHubPopover();
        }
      });

      document.getElementById('btnCloseHubPopover').addEventListener('click', () => {
        el.hubPopoverPanel.classList.remove('open');
      });

      document.querySelectorAll('[data-hubtab]').forEach((tab) => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('[data-hubtab]').forEach((t) => t.classList.remove('active'));
          tab.classList.add('active');
          state.hubTab = tab.getAttribute('data-hubtab') || 'deliverables';
          renderHubPopover();
        });
      });

      document.getElementById('btnCopyCli').addEventListener('click', (e) => {
        const activeSession = state.sessions.find((s) => s.session_id === state.activeSessionId);
        if (!activeSession) return;
        const cmd = activeSession.resume_command || `agy --conversation ${activeSession.session_id}`;
        navigator.clipboard.writeText(cmd);
        const btn = e.currentTarget;
        btn.setAttribute('data-popover', 'Đã sao chép lệnh CLI!');
        setTimeout(() => btn.setAttribute('data-popover', 'Sao chép lệnh mở trên Terminal'), 1400);
      });

      document.getElementById('btnThemeToggle').addEventListener('click', () => {
        const html = document.documentElement;
        html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      });

      el.btnQuickCmd.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = el.quickCmdPopover.classList.contains('open');
        closeAllPopovers();
        if (!wasOpen) el.quickCmdPopover.classList.add('open');
      });

      el.btnAgentPicker.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = el.agentPickerPopover.classList.contains('open');
        closeAllPopovers();
        if (!wasOpen) el.agentPickerPopover.classList.add('open');
      });

      document.querySelectorAll('[data-close-pop]').forEach((btn) => {
        btn.addEventListener('click', () => closeAllPopovers());
      });

      document.querySelectorAll('[data-quick-cmd]').forEach((opt) => {
        opt.addEventListener('click', () => {
          el.composerTextarea.value = opt.getAttribute('data-quick-cmd') || '';
          closeAllPopovers();
          el.composerTextarea.focus();
        });
      });

      document.querySelectorAll('[data-agent-val]').forEach((opt) => {
        opt.addEventListener('click', () => {
          document.querySelectorAll('[data-agent-val]').forEach((o) => o.classList.remove('selected'));
          opt.classList.add('selected');
          state.selectedAgentVal = opt.getAttribute('data-agent-val') || 'auto';
          const label = opt.querySelector('span').textContent;
          el.btnAgentPicker.setAttribute('data-popover', `Người thực thi: ${label}`);
          closeAllPopovers();
        });
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.popover-panel') && !e.target.closest('#btnQuickCmd') && !e.target.closest('#btnAgentPicker') && !e.target.closest('#btnOpenHubPopover') && !e.target.closest('#btnOpenMachinesPopover') && !e.target.closest('#btnAutoSpeak')) {
          closeAllPopovers();
        }
      });

      el.composerTextarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendChatCommand();
        }
      });

      el.btnSendCommand.addEventListener('click', sendChatCommand);

      el.btnAbortJob.addEventListener('click', async () => {
        if (!state.daemonOnline || !state.activeSessionId) return;
        try {
          await fetch(`${LOCAL_API_BASE}/api/chat/abort`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: state.activeSessionId }),
          });
          await fetchLiveSessions(false);
        } catch (_) {}
      });

      // Voice Speech-to-Text
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      let recognition = null;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'vi-VN';
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.onstart = () => {
          state.isRecordingMic = true;
          el.btnVoiceMic.classList.add('danger');
          el.btnVoiceMic.setAttribute('data-popover', 'Đang nghe Sếp nói...');
        };
        recognition.onresult = (event) => {
          el.composerTextarea.value = event.results[0][0].transcript;
          sendChatCommand();
        };
        recognition.onend = () => {
          state.isRecordingMic = false;
          el.btnVoiceMic.classList.remove('danger');
          el.btnVoiceMic.setAttribute('data-popover', 'Bấm để nói lệnh tiếng Việt');
        };
      }

      el.btnVoiceMic.addEventListener('click', () => {
        if (!recognition) {
          alert('Trình duyệt không hỗ trợ Mic giọng nói. Sếp vui lòng mở bằng Chrome hoặc Edge.');
          return;
        }
        if (state.isRecordingMic) recognition.stop();
        else recognition.start();
      });

      document.getElementById('btnCloseModal').addEventListener('click', () => {
        el.mediaModalBackdrop.classList.remove('open');
        el.modalBodyContent.innerHTML = '';
      });

      el.mediaModalBackdrop.addEventListener('click', (e) => {
        if (e.target === el.mediaModalBackdrop) {
          el.mediaModalBackdrop.classList.remove('open');
          el.modalBodyContent.innerHTML = '';
        }
      });

      loadLinkedMachines();
      loadBrainSnapshotMetadata();
      fetchLiveSessions(true);
      setInterval(() => fetchLiveSessions(false), 1500);
    })();
  </script>
</body>
</html>
